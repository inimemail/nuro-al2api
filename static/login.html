<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.title">登录 - AIClient2API</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f0fdf4;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(5, 150, 105, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 60% 10%, rgba(99, 102, 241, 0.06) 0%, transparent 45%);
        }

        [data-theme="dark"] body {
            background: #0f172a;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(52, 211, 153, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 55%);
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(5, 150, 105, 0.08),
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 20px 40px -8px rgba(0, 0, 0, 0.1);
            width: 100%;
            padding: 2.5rem;
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
            font-size: 1.75rem;
            color: white;
        }

        .logo img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.25);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.375rem;
            letter-spacing: -0.03em;
        }

        .logo p {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.875rem;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 0.875rem 0.75rem 2.5rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #059669;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
        }

        .form-group input::placeholder {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.8125rem;
            margin-top: 0.5rem;
            display: none;
            align-items: center;
            gap: 0.375rem;
            animation: shake 0.3s ease-in-out;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .error-message.show {
            display: flex;
        }

        .login-button {
            width: 100%;
            padding: 0.8125rem;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            letter-spacing: -0.01em;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
            font-family: inherit;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
        }

        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
        }

        .login-button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .footer {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid #f1f5f9;
            margin-top: 0.5rem;
        }

        .footer p {
            font-size: 0.8125rem;
            color: #94a3b8;
        }

        .loading {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.7s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .lang-switcher-wrap {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                border-radius: 16px;
            }

            .logo h1 {
                font-size: 1.25rem;
            }
        }
    </style>
    <link rel="stylesheet" href="app/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="lang-switcher-wrap" id="langSwitcherContainer"></div>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo">
                <img src="/favicon.ico" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div class="logo-icon" style="display:none"><i class="fas fa-robot"></i></div>
                <h1>AIClient2API</h1>
                <p data-i18n="login.heading">请登录以继续</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="password" data-i18n="login.password">密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            data-i18n="login.passwordPlaceholder"
                            placeholder="请输入密码"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <div class="error-message" id="errorMessage">
                        <i class="fas fa-exclamation-circle"></i>
                        <span data-i18n="login.error.incorrect">密码错误，请重试</span>
                    </div>
                </div>

                <button type="submit" class="login-button" id="loginButton" data-i18n="login.button">
                    登录
                </button>
            </form>

            <div class="footer">
                <p>&copy; 2077 AIClient2API. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initI18n, t, setLanguage } from './app/i18n.js';
        import { initLanguageSwitcher } from './app/language-switcher.js';

        initI18n();

        const langContainer = document.getElementById('langSwitcherContainer');
        if (langContainer) {
            import('./app/language-switcher.js').then(module => {
                const switcher = module.createLanguageSwitcher();
                langContainer.appendChild(switcher);

                const languageBtn = switcher.querySelector('#languageBtn');
                const languageDropdown = switcher.querySelector('#languageDropdown');
                const languageOptions = switcher.querySelectorAll('.language-option');

                languageBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    languageDropdown.classList.toggle('show');
                });

                languageOptions.forEach(option => {
                    option.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const lang = option.getAttribute('data-lang');
                        setLanguage(lang);
                        switcher.querySelector('.current-lang').textContent = lang === 'zh-CN' ? '中文' : 'EN';
                        languageOptions.forEach(opt => opt.classList.remove('active'));
                        option.classList.add('active');
                        languageDropdown.classList.remove('show');
                    });
                });

                document.addEventListener('click', () => {
                    languageDropdown.classList.remove('show');
                });
            });
        }

        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = document.getElementById('loginButton');

        checkLoginStatus();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value.trim();

            if (!password) {
                showError(t('login.error.empty'));
                return;
            }

            loginButton.disabled = true;
            loginButton.innerHTML = `<span class="loading"></span>${t('login.loggingIn')}`;
            errorMessage.classList.remove('show');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('authToken', data.token);
                    window.location.href = '/';
                } else {
                    const errorMsg = data.messageCode ? t(data.messageCode, data.messageParams) : (data.message || t('login.error.incorrect'));
                    showError(errorMsg);
                    loginButton.disabled = false;
                    loginButton.innerHTML = t('login.button');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError(t('login.error.failed'));
                loginButton.disabled = false;
                loginButton.innerHTML = t('login.button');
            }
        });

        function showError(message) {
            const span = errorMessage.querySelector('span');
            if (span) span.textContent = message;
            else errorMessage.textContent = message;
            errorMessage.classList.add('show');
            passwordInput.style.borderColor = '#ef4444';

            setTimeout(() => {
                passwordInput.style.borderColor = '';
            }, 600);
        }

        function checkLoginStatus() {
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = '/';
            }
        }

        passwordInput.addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });

        passwordInput.focus();
    </script>
    </body>
</html>
